<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Site Master Glossary</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--a:#ffb454}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:10px 0;padding:14px}.toolbar{display:grid;grid-template-columns:2fr 1fr;gap:10px}.toolbar input,.toolbar select{width:100%;padding:13px;border:1px solid var(--l);border-radius:10px;background:#0d1116;color:var(--t);font:inherit}.entry{border-left:4px solid var(--a)}.term{font-size:21px;font-weight:900}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin:5px}.research{border-top:1px solid var(--l);margin-top:9px;padding-top:9px;color:var(--m)}@media(max-width:650px){.toolbar{grid-template-columns:1fr}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Site Master Glossary</h1><p class="muted">MAYHEM architecture, evidence states, lifecycle states, audit language and public-interface controls.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="audit-clock.html">Audit Clock</a><a href="glossary.html">NRL Master Glossary</a><a class="active" href="site-master-glossary.html">Site Master Glossary</a><a href="sites.html">Research Sites</a></div><div class="card"><div id="count" style="font-size:28px;font-weight:900">—</div><div class="muted">SITE TERMS IN CURRENT SNAPSHOT</div><div id="snap" class="muted"></div></div><div class="toolbar"><input id="search" placeholder="Search MAYHEM or site term"><select id="category"><option value="">All categories</option></select></div><div id="entries"></div><script>let G;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=search.value.toLowerCase(),cat=category.value;const rows=(G.terms||[]).filter(x=>(!cat||x.category===cat)&&(!q||[x.term,x.category,x.plain_language,x.research_use].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.term.localeCompare(b.term));entries.innerHTML=rows.map(x=>`<article class="card entry"><div class="term">${esc(x.term)}</div><span class="pill">${esc(x.category)}</span><span class="pill">${esc(x.status)}</span><p>${esc(x.plain_language)}</p><div class="research"><b class="gold">Research / control use</b><br>${esc(x.research_use)}</div></article>`).join('')}fetch('data/site-master-glossary-2026.json?'+Date.now()).then(r=>r.json()).then(j=>{G=j;count.textContent=(j.terms||[]).length;snap.textContent=j.snapshot+' · '+j.scope;const cats=[...new Set((j.terms||[]).map(x=>x.category))].sort();category.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');render()}).catch(()=>entries.innerHTML='<div class="card muted">Site glossary data unavailable.</div>');search.oninput=render;category.onchange=render</script></main></body></html>
