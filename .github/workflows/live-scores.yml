name: NRL live score capture

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-live-scores.mjs'
      - 'scripts/reconcile-live-lifecycle.mjs'
      - '.github/workflows/live-scores.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nrl-live-scores
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture official NRL live state
        id: capture
        continue-on-error: true
        env:
          NRL_ROUND: '27'
        run: node scripts/update-live-scores.mjs
      - name: Reconcile governed lifecycle
        if: steps.capture.outcome == 'success'
        run: node scripts/reconcile-live-lifecycle.mjs
      - name: Persist changed governed state
        run: |
          if git diff --quiet -- data/live-scores-2026.json data/season-canonical-2026.json data/checkpoints-round27-canonical.json; then
            echo 'No governed state change to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-scores-2026.json data/season-canonical-2026.json data/checkpoints-round27-canonical.json
          git commit -m 'Update NRL live and lifecycle state'
          git push
      - name: Report capture failure
        if: steps.capture.outcome == 'failure'
        run: |
          echo 'Official acquisition failed; SOURCE_UNAVAILABLE snapshot persisted without invented score state.'
          exit 1
