name: Retrospective Single-Signal Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/season-canonical-2026.json'
      - 'scripts/generate-single-signals.mjs'
      - '.github/workflows/single-signal.yml'
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate retrospective single-signal records
        run: node scripts/generate-single-signals.mjs
      - name: Persist generated evidence
        run: |
          OUTPUTS=(
            data/single-signal-registry-2026.json
            data/single-signal-observations-2026.json
            data/single-signal-leaderboard-2026.json
            data/single-signal-falsification-2026.json
          )
          if [ -z "$(git status --porcelain -- "${OUTPUTS[@]}")" ]; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${OUTPUTS[@]}"
          git commit -m 'Update retrospective single-signal evidence'
          git push
