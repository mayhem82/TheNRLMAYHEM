<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Players</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454;--bad:#ff7d7d}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.toolbar,.card{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:10px 0;padding:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar select,.toolbar input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;background:#0d1116;color:var(--t);font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}.player{border-top:4px solid var(--g)}.name{font-size:22px;font-weight:900}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.verified{color:var(--ok)}.signal{color:var(--a)}.contradicted{color:var(--bad)}.row{padding:8px 0;border-top:1px solid var(--l)}.row b{display:block;font-size:12px;color:var(--m);margin-bottom:3px}.small{font-size:12px}.empty{text-align:center;padding:30px;color:var(--m)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.stat{background:#0d1116;border:1px solid var(--l);border-radius:8px;padding:8px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--m)}.intel{line-height:1.45}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Players</h1><p class="muted">Roster-backed player intelligence using official season and career evidence. Raw statistics and MAYHEM interpretation are shown separately.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a href="teams.html">Teams</a><a class="active" href="players.html">Players</a><a href="audit-clock.html">Audit Clock</a></div><div class="toolbar"><select id="team"><option value="">All teams</option></select><input id="search" placeholder="Search player, status or fixture"></div><div class="card"><b>PLAYER INTELLIGENCE STATE</b><div id="fresh" class="small muted"></div></div><div id="cards" class="grid"></div><script>let DATA=[];const team=document.getElementById('team'),search=document.getElementById('search'),cards=document.getElementById('cards'),fresh=document.getElementById('fresh');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function rosterRecords(j){const out=[];(j.teams||[]).forEach(t=>(t.players||[]).forEach(p=>out.push({player:p.player,team:t.team,position_context:p.position_context,fixture:t.fixture,captured_at:j.captured_at,classification:'VERIFIED',status:p.squad_state,decision_effect:'ACQUISITION_ACTIVE',observation:`Official Round 27 squad listing · jersey ${p.jersey}.`,macro_effect:null,source:j.source,record_type:'ROSTER_BASELINE'})));return out}function latestView(all){const g=new Map();for(const x of all){const k=x.team+'|'+x.player,c=g.get(k);if(!c){g.set(k,x);continue}const xi=x.record_type!=='ROSTER_BASELINE',ci=c.record_type!=='ROSTER_BASELINE';if(xi&&!ci||xi===ci&&new Date(x.captured_at)>new Date(c.captured_at))g.set(k,x)}return [...g.values()].sort((a,b)=>a.team.localeCompare(b.team)||a.player.localeCompare(b.player))}function statBox(s){if(!s)return'<div class="muted small">OPEN ACQUISITION DEFECT — statistical dossier still being collected.</div>';const vals=[['APPS',s.appearances],['TRIES',s.tries],['TRY AST',s.try_assists],['LINE BREAKS',s.line_breaks],['LB AST',s.line_break_assists],['TACKLE BREAKS',s.tackle_breaks],['TACKLES',s.tackles_made],['MISSED',s.missed_tackles],['AVG RUN m',s.average_running_metres],['TOTAL RUN m',s.total_running_metres],['AVG HIT-UPS',s.average_hit_ups],['POST-CONTACT m',s.post_contact_metres],['OFFLOADS',s.offloads],['RECEIPTS',s.receipts],['AVG KICK m',s.average_kicking_metres],['FORCED DO',s.forced_drop_outs],['GOALS',s.goals],['FANTASY AVG',s.fantasy_average]].filter(x=>x[1]!=null);return`<div class="stats">${vals.map(x=>`<div class="stat"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('')}</div>`}function intelText(x){const s=x.stats?.season,p=(x.position_context||'').toLowerCase();if(!s)return 'OPEN ACQUISITION DEFECT: this card is incomplete. MAYHEM must continue evidence collection; absence from the card is not interpreted as absence of public evidence.';let bits=[];if(p.includes('half')||p.includes('five-eighth')){if(s.try_assists!=null)bits.push(`${s.try_assists} try assists`);if(s.line_break_assists!=null)bits.push(`${s.line_break_assists} line-break assists`);if(s.average_kicking_metres!=null)bits.push(`${s.average_kicking_metres} average kicking metres`);if(s.forced_drop_outs!=null)bits.push(`${s.forced_drop_outs} forced drop-outs`);return `Primary creation and field-position evidence: ${bits.join(', ')}. These quantify playmaking load and territorial control; recent-round direction is assessed separately from the raw season baseline.`}if(p.includes('hooker')){if(s.tackles_made!=null)bits.push(`${s.tackles_made} tackles`);if(s.try_assists!=null)bits.push(`${s.try_assists} try assists`);if(s.receipts!=null)bits.push(`${s.receipts} receipts`);if(s.average_kicking_metres!=null)bits.push(`${s.average_kicking_metres} average kicking metres`);return `Ruck-control and distribution evidence: ${bits.join(', ')}. This quantifies defensive workload and attacking involvement rather than merely confirming selection.`}if(p.includes('prop')||p.includes('lock')||p.includes('interchange')){if(s.average_running_metres!=null)bits.push(`${s.average_running_metres} average running metres`);if(s.post_contact_metres!=null)bits.push(`${s.post_contact_metres} post-contact metres`);if(s.tackles_made!=null)bits.push(`${s.tackles_made} tackles`);if(s.offloads!=null)bits.push(`${s.offloads} offloads`);if(s.average_hit_ups!=null)bits.push(`${s.average_hit_ups} average hit-ups`);return `Middle/workload evidence: ${bits.join(', ')}. This measures carry volume, contact work and defensive load; matchup direction is determined against opponent and recent-form evidence.`}if(p.includes('second row')){if(s.average_running_metres!=null)bits.push(`${s.average_running_metres} average running metres`);if(s.tackles_made!=null)bits.push(`${s.tackles_made} tackles`);if(s.line_breaks!=null)bits.push(`${s.line_breaks} line breaks`);if(s.line_break_assists!=null)bits.push(`${s.line_break_assists} line-break assists`);if(s.offloads!=null)bits.push(`${s.offloads} offloads`);return `Edge-forward evidence: ${bits.join(', ')}. This measures work rate and attacking involvement; matchup and recent-round evidence determine direction.`}if(p.includes('fullback')||p.includes('winger')||p.includes('centre')){if(s.tries!=null)bits.push(`${s.tries} tries`);if(s.line_breaks!=null)bits.push(`${s.line_breaks} line breaks`);if(s.tackle_breaks!=null)bits.push(`${s.tackle_breaks} tackle breaks`);if(s.average_running_metres!=null)bits.push(`${s.average_running_metres} average running metres`);if(s.try_assists!=null)bits.push(`${s.try_assists} try assists`);return `Backline production evidence: ${bits.join(', ')}. This establishes attacking output and yardage contribution; recent form and opposition-specific effect remain separate evidence questions.`}return `Verified 2026 production: ${Object.entries(s).filter(([k,v])=>v!=null&&['appearances','tries','try_assists','tackles_made','average_running_metres','total_running_metres'].includes(k)).map(([k,v])=>`${k.replaceAll('_',' ')} ${v}`).join(', ')}.`}function macroText(x){if(x.record_type!=='ROSTER_BASELINE'&&x.macro_effect)return x.macro_effect;return intelText(x)}function render(){const q=search.value.trim().toLowerCase(),tv=team.value;let r=DATA.filter(x=>(!tv||x.team===tv)&&(!q||[x.player,x.team,x.status,x.fixture,x.observation,macroText(x)].join(' ').toLowerCase().includes(q)));cards.innerHTML=r.length?r.map(x=>`<article class="card player"><div class="name">${esc(x.player)}</div><div class="muted">${esc(x.team)} · ${esc(x.position_context)}</div><div class="meta"><span class="pill ${String(x.classification).toLowerCase()}">${esc(x.classification)}</span><span class="pill">${esc(x.status)}</span><span class="pill">${esc(x.stats?.season?'EVIDENCE_CAPTURED':'ACQUISITION_DEFECT_OPEN')}</span></div><div class="row"><b>2026 PERFORMANCE</b>${statBox(x.stats?.season)}</div>${x.stats?.career?`<div class="row small"><b>CAREER</b>${esc(x.stats.career.appearances)} appearances${x.stats.career.tries!=null?' · '+esc(x.stats.career.tries)+' tries':''}</div>`:''}<div class="row intel"><b>MAYHEM PLAYER INTELLIGENCE</b>${esc(macroText(x))}</div><div class="row"><b>CURRENT EVIDENCE</b>${esc(x.observation)}</div><div class="row"><b>FIXTURE</b>${esc(x.fixture)}</div><div class="row small"><b>CAPTURED</b>${esc(new Date(x.captured_at).toLocaleString('en-AU',{timeZone:'Australia/Sydney',dateStyle:'medium',timeStyle:'medium'}))} AEST/AEDT · ${esc(x.source)}</div></article>`).join(''):'<div class="empty">No player intelligence matches this view.</div>'}Promise.all([fetch('data/player-intelligence-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-roster-round27-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-stats-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-stats-dragons-eels-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-stats-wests-tigers-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-stats-eels-supplement-2026.json?'+Date.now()).then(r=>r.json())]).then(([intel,roster,stats,fixtureStats,tigersStats,eelsSupplement])=>{const allStats=[...(stats.players||[]),...(fixtureStats.players||[]),...(tigersStats.players||[]),...(eelsSupplement.players||[])];const sm=new Map(allStats.map(x=>[x.team+'|'+x.player,x]));DATA=latestView([...(intel.records||[]),...rosterRecords(roster)]).map(x=>({...x,stats:sm.get(x.team+'|'+x.player)||null}));const teams=[...new Set(DATA.map(x=>x.team))].sort();team.innerHTML='<option value="">All teams</option>'+teams.map(t=>`<option>${esc(t)}</option>`).join('');const q=new URLSearchParams(location.search),qt=q.get('team'),qp=q.get('player');if(qt&&teams.includes(qt))team.value=qt;if(qp)search.value=qp;const prof=DATA.filter(x=>x.stats?.season).length;const gaps=DATA.filter(x=>!x.stats?.season).length;fresh.textContent=`${DATA.length} persistent player states · ${prof} dossiers captured · ${gaps} acquisition defects open and requiring correction`;render()}).catch(()=>cards.innerHTML='<div class="empty">Player intelligence data unavailable.</div>');team.onchange=render;search.oninput=render;</script></main></body></html>
