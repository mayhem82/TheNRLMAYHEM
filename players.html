<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Players</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454;--bad:#ff7d7d}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.toolbar,.card{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:10px 0;padding:14px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar select,.toolbar input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;background:#0d1116;color:var(--t);font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}.player{border-top:4px solid var(--g)}.name{font-size:22px;font-weight:900}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pill{border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.verified{color:var(--ok)}.signal{color:var(--a)}.contradicted{color:var(--bad)}.row{padding:8px 0;border-top:1px solid var(--l)}.row b{display:block;font-size:12px;color:var(--m);margin-bottom:3px}.small{font-size:12px}.empty{text-align:center;padding:30px;color:var(--m)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.stat{background:#0d1116;border:1px solid var(--l);border-radius:8px;padding:8px}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--m)}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Players</h1><p class="muted">Roster-backed player intelligence with official season and career performance data. Evidence states and raw statistics remain separate.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a href="teams.html">Teams</a><a class="active" href="players.html">Players</a><a href="audit-clock.html">Audit Clock</a></div><div class="toolbar"><select id="team"><option value="">All teams</option></select><input id="search" placeholder="Search player, status or fixture"></div><div class="card"><b>PLAYER INTELLIGENCE STATE</b><div id="fresh" class="small muted"></div></div><div id="cards" class="grid"></div><script>let DATA=[];const team=document.getElementById('team'),search=document.getElementById('search'),cards=document.getElementById('cards'),fresh=document.getElementById('fresh');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function rosterRecords(j){const out=[];(j.teams||[]).forEach(t=>(t.players||[]).forEach(p=>out.push({player:p.player,team:t.team,position_context:p.position_context,fixture:t.fixture,captured_at:j.captured_at,classification:'VERIFIED',status:p.squad_state,decision_effect:'NO_MATERIAL_CHANGE',observation:`Official Round 27 squad listing · jersey ${p.jersey}.`,macro_effect:'Roster presence established. No directional effect assigned without separate evidence.',source:j.source,record_type:'ROSTER_BASELINE'})));return out}function latestView(all){const g=new Map();for(const x of all){const k=x.team+'|'+x.player,c=g.get(k);if(!c){g.set(k,x);continue}const xi=x.record_type!=='ROSTER_BASELINE',ci=c.record_type!=='ROSTER_BASELINE';if(xi&&!ci||xi===ci&&new Date(x.captured_at)>new Date(c.captured_at))g.set(k,x)}return [...g.values()].sort((a,b)=>a.team.localeCompare(b.team)||a.player.localeCompare(b.player))}function statBox(s){if(!s)return'<div class="muted small">2026 statistical profile not yet available from the source.</div>';const vals=[['APPS',s.appearances],['TRIES',s.tries],['TRY AST',s.try_assists],['TACKLES',s.tackles_made],['AVG RUN m',s.average_running_metres],['TOTAL RUN m',s.total_running_metres],['OFFLOADS',s.offloads],['AVG KICK m',s.average_kicking_metres]].filter(x=>x[1]!=null);return`<div class="stats">${vals.map(x=>`<div class="stat"><b>${esc(x[1])}</b><span>${esc(x[0])}</span></div>`).join('')}</div>`}function render(){const q=search.value.trim().toLowerCase(),tv=team.value;let r=DATA.filter(x=>(!tv||x.team===tv)&&(!q||[x.player,x.team,x.status,x.fixture,x.observation,x.macro_effect].join(' ').toLowerCase().includes(q)));cards.innerHTML=r.length?r.map(x=>`<article class="card player"><div class="name">${esc(x.player)}</div><div class="muted">${esc(x.team)} · ${esc(x.position_context)}</div><div class="meta"><span class="pill ${String(x.classification).toLowerCase()}">${esc(x.classification)}</span><span class="pill">${esc(x.status)}</span><span class="pill">${esc(x.decision_effect)}</span></div><div class="row"><b>2026 PERFORMANCE</b>${statBox(x.stats?.season)}</div>${x.stats?.career?`<div class="row small"><b>CAREER</b>${esc(x.stats.career.appearances)} appearances · ${esc(x.stats.career.tries)} tries</div>`:''}<div class="row"><b>CURRENT OBSERVATION</b>${esc(x.observation)}</div><div class="row"><b>TEAM MACRO EFFECT</b>${esc(x.macro_effect)}</div><div class="row"><b>FIXTURE</b>${esc(x.fixture)}</div><div class="row small"><b>CAPTURED</b>${esc(new Date(x.captured_at).toLocaleString('en-AU',{timeZone:'Australia/Sydney',dateStyle:'medium',timeStyle:'medium'}))} AEST/AEDT · ${esc(x.source)}</div></article>`).join(''):'<div class="empty">No player intelligence matches this view.</div>'}Promise.all([fetch('data/player-intelligence-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-roster-round27-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-stats-2026.json?'+Date.now()).then(r=>r.json())]).then(([intel,roster,stats])=>{const sm=new Map((stats.players||[]).map(x=>[x.team+'|'+x.player,x]));DATA=latestView([...(intel.records||[]),...rosterRecords(roster)]).map(x=>({...x,stats:sm.get(x.team+'|'+x.player)||null}));const teams=[...new Set(DATA.map(x=>x.team))].sort();team.innerHTML='<option value="">All teams</option>'+teams.map(t=>`<option>${esc(t)}</option>`).join('');const q=new URLSearchParams(location.search),qt=q.get('team'),qp=q.get('player');if(qt&&teams.includes(qt))team.value=qt;if(qp)search.value=qp;const prof=DATA.filter(x=>x.stats?.season).length;fresh.textContent=`${DATA.length} persistent player states · ${prof} with verified 2026 statistical profiles`;render()}).catch(()=>cards.innerHTML='<div class="empty">Player intelligence data unavailable.</div>');team.onchange=render;search.oninput=render;</script></main></body></html>
