<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Research Sites</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:10px 0;padding:14px}.entry{border-left:4px solid var(--l)}.name{font-size:21px;font-weight:900}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin:6px 3px}.use{line-height:1.5;color:var(--m);margin-top:8px}.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.rule{background:#0d1116;border:1px solid var(--l);border-radius:9px;padding:11px}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Research Sites</h1><p class="muted">Source-location registry only. A listing is not evidence by itself.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="audit-clock.html">Audit Clock</a><a href="glossary.html">NRL Master Glossary</a><a href="site-master-glossary.html">Site Master Glossary</a><a class="active" href="sites.html">Research Sites</a></div><div class="card"><b class="gold">Source-use rules</b><div class="rules" id="rules"></div></div><div id="entries"></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sid=x=>'SRC-'+String(x.name||'source').toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'');fetch('data/research-sites-2026.json?'+Date.now()).then(r=>r.json()).then(j=>{rules.innerHTML=(j.rules||[]).map(x=>`<div class="rule">${esc(x)}</div>`).join('');entries.innerHTML=(j.sites||[]).map(x=>`<article class="card entry"><div class="name">${esc(x.name)}</div><span class="pill">${esc(x.class)}</span><span class="pill">${esc(x.source_id||sid(x))}</span><div><a class="gold" href="${esc(x.url)}">${esc(x.url)}</a></div><div class="use"><b>Research use</b><br>${esc(x.research_use)}</div></article>`).join('')}).catch(()=>entries.innerHTML='<div class="card muted">Research sites data unavailable.</div>')</script></main></body></html>
