<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Audit Clock</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454;--bad:#ff7272}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.fixture{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:12px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.count{color:var(--a);font-weight:900;font-variant-numeric:tabular-nums}.cp{display:grid;grid-template-columns:90px 1fr;gap:10px;border-top:1px solid var(--l);padding:11px 0}.cp:first-of-type{margin-top:10px}.status{font-weight:900}.captured{color:var(--ok)}.missed{color:var(--bad)}.pending{color:var(--m)}.finding{font-size:13px;color:var(--m);margin:5px 0}.fact{font-size:13px;margin:6px 0}.fact b{font-size:11px;border:1px solid var(--l);border-radius:999px;padding:2px 6px;margin-right:5px}.stamp{font-size:12px;color:var(--m)}.intel{border-left:3px solid var(--g);padding-left:10px;margin-top:8px}.conflict{color:var(--a);font-size:12px;margin:4px 0}.decision{font-size:13px;margin-top:7px}.tip{color:var(--g);font-weight:900}.result{font-size:18px;font-weight:900;color:var(--ok);margin-top:5px}@media(max-width:600px){.head{display:block}.cp{grid-template-columns:75px 1fr}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Audit Clock</h1><p class="muted">Checkpoint execution plus fixture lifecycle reconciliation. Verified results close fixtures even if a later analytical checkpoint is still outstanding.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a href="glossary.html">NRL Master Glossary</a><a href="site-master-glossary.html">Site Master Glossary</a><a class="active" href="audit-clock.html">Audit Clock</a></div><p id="snap" class="stamp"></p><div id="app"></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true,timeZoneName:'short'}).format(new Date(x));let SEASON={},LEDGER=null,RECON=null;function lifecycle(f){const s=SEASON[f.match];if(s?.status==='played'&&s.score)return 'FULL TIME · '+s.score;const z=new Date(f.kickoff)-Date.now();if(z<=-10800000)return 'POST-MATCH · RESULT VERIFICATION PENDING';if(z<=0)return 'MATCH WINDOW';let sec=Math.floor(z/1000),d=Math.floor(sec/86400);sec%=86400;let h=Math.floor(sec/3600);sec%=3600;let m=Math.floor(sec/60);return 'KICKOFF IN '+(d?d+'d ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(sec%60).padStart(2,'0')+'s'}function cls(s){if(s.startsWith('CAPTURED')||s.startsWith('RESULT_VERIFIED'))return'captured';if(s.startsWith('MISSED'))return'missed';return'pending'}function details(c){let out='';if(c.findings)out+=c.findings.map(x=>'<div class="finding">• '+esc(x)+'</div>').join('');if(c.source_facts)out+=c.source_facts.map(x=>'<div class="fact"><b>'+esc(x.classification)+'</b>'+esc(x.fact)+'</div>').join('');if(c.conflicts?.length)out+='<div class="intel"><div class="stamp">CONFLICTS</div>'+c.conflicts.map(x=>'<div class="conflict">• '+esc(x.replaceAll('_',' '))+'</div>').join('')+'</div>';if(c.inference)out+='<div class="intel"><div class="stamp">MAYHEM INFERENCE</div><div class="finding">'+esc(c.inference)+'</div></div>';if(c.decision_effect||c.tip)out+='<div class="decision">Decision effect: <b>'+esc((c.decision_effect||'').replaceAll('_',' '))+'</b>'+(c.tip?' · Selection: <span class="tip">'+esc(c.tip)+(c.confidence!=null?' '+esc(c.confidence)+'%':'')+'</span>':'')+'</div>';return out}function applyRecon(){if(!RECON||!LEDGER)return;for(const r of RECON.reconciliation||[]){const f=LEDGER.fixtures.find(x=>x.match===r.fixture);if(!f)continue;for(const st of r.missed_checkpoints||[]){const c=f.checkpoints.find(x=>x.stage===st);if(c&&!String(c.status).startsWith('CAPTURED'))c.status='MISSED_NOT_CAPTURED'}if(r.checkpoint_state){for(const [stage,state] of Object.entries(r.checkpoint_state)){const c=f.checkpoints.find(x=>x.stage===stage);if(c&&state==='MISSED_NOT_CAPTURED'&&!String(c.status).startsWith('CAPTURED'))c.status='MISSED_NOT_CAPTURED'}}}LEDGER.generated_at=RECON.captured_at||LEDGER.generated_at}function postBlock(f,c){const s=SEASON[f.match];if(c.stage!=='POST'||!s||s.status!=='played')return null;const rr=(RECON?.reconciliation||[]).find(x=>x.fixture===f.match);return `<span class="status captured">RESULT VERIFIED</span><div class="result">${esc(f.match)} · ${esc(s.score)}</div><div class="stamp">Tip grade: ${esc(s.grade||'NOT GRADED')}</div><div class="finding">Post-match analytical state: ${esc(rr?.post_analysis_state||'PENDING').replaceAll('_',' ')}.</div>`}function render(){const d=LEDGER;document.getElementById('snap').textContent='CHECKPOINT LEDGER SNAPSHOT: '+fmt(d.generated_at)+' · lifecycle reconciliation applied';document.getElementById('app').innerHTML=d.fixtures.map(f=>'<section class="fixture"><div class="head"><div><b>'+esc(f.match)+'</b><div class="stamp">Kickoff: '+fmt(f.kickoff)+(f.current_tip?' · MAYHEM: <span class="tip">'+esc(f.current_tip)+' '+esc(f.confidence)+'%</span>':'')+'</div></div><div class="count" data-match="'+esc(f.match)+'">'+esc(lifecycle(f))+'</div></div>'+f.checkpoints.map(c=>{const p=postBlock(f,c);return '<div class="cp"><b>'+esc(c.stage)+'</b><div>'+(p||('<span class="status '+cls(c.status)+'">'+esc(c.status.replaceAll('_',' '))+'</span><div class="stamp">Due: '+(c.due==='AFTER_FULL_TIME'?'after full time':fmt(c.due))+(c.captured_at?' · Captured: '+fmt(c.captured_at):'')+'</div>'+details(c)))+'</div></div>'}).join('')+'</section>').join('')}function tick(){if(!LEDGER)return;document.querySelectorAll('[data-match]').forEach(e=>{const f=LEDGER.fixtures.find(x=>x.match===e.dataset.match);if(f)e.textContent=lifecycle(f)})}Promise.all([fetch('data/checkpoints-round27.json?'+Date.now()).then(r=>r.json()),fetch('data/season-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/reconciliation-2026-09-06-1205-aest.json?'+Date.now()).then(r=>r.json())]).then(([d,s,r])=>{LEDGER=d;RECON=r;(s.round27||[]).forEach(x=>SEASON[x.home+' v '+x.away]=x);applyRecon();render();setInterval(tick,1000)}).catch(()=>document.getElementById('app').textContent='Audit data unavailable.')</script></main></body></html>
