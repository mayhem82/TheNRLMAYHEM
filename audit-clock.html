<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Audit Clock</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454;--bad:#ff7272}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.fixture{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:12px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.count{color:var(--a);font-weight:900;font-variant-numeric:tabular-nums}.cp{display:grid;grid-template-columns:90px 1fr;gap:10px;border-top:1px solid var(--l);padding:9px 0}.cp:first-of-type{margin-top:10px}.status{font-weight:900}.captured{color:var(--ok)}.missed{color:var(--bad)}.pending{color:var(--m)}.due{color:var(--a)}.finding{font-size:13px;color:var(--m);margin:4px 0}.stamp{font-size:12px;color:var(--m)}@media(max-width:600px){.head{display:block}.cp{grid-template-columns:75px 1fr}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Audit Clock</h1><p class="muted">Per-match checkpoint execution. Every state carries an exact Australia/Sydney timestamp. Missed checkpoints remain missed; they are never reconstructed after the fact.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a class="active" href="audit-clock.html">Audit Clock</a></div><p id="snap" class="stamp"></p><div id="app"></div><script>const fmt=x=>new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true,timeZoneName:'short'}).format(new Date(x));function countdown(t){let z=new Date(t)-Date.now();if(z<=0)return 'KICKOFF PASSED';let s=Math.floor(z/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return 'KICKOFF IN '+(d?d+'d ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s%60).padStart(2,'0')+'s'}function cls(s){if(s.startsWith('CAPTURED'))return'captured';if(s.startsWith('MISSED'))return'missed';return'pending'}function render(d){document.getElementById('snap').textContent='LEDGER SNAPSHOT: '+fmt(d.generated_at);let app=document.getElementById('app');app.innerHTML=d.fixtures.map(f=>'<section class="fixture"><div class="head"><div><b>'+f.match+'</b><div class="stamp">Kickoff: '+fmt(f.kickoff)+'</div></div><div class="count" data-k="'+f.kickoff+'"></div></div>'+f.checkpoints.map(c=>'<div class="cp"><b>'+c.stage+'</b><div><span class="status '+cls(c.status)+'">'+c.status.replaceAll('_',' ')+'</span><div class="stamp">Due: '+(c.due==='AFTER_FULL_TIME'?'after full time':fmt(c.due))+(c.captured_at?' · Captured: '+fmt(c.captured_at):'')+'</div>'+(c.findings?c.findings.map(x=>'<div class="finding">• '+x+'</div>').join(''):'')+'</div></div>').join('')+'</section>').join('');tick()}function tick(){document.querySelectorAll('[data-k]').forEach(e=>e.textContent=countdown(e.dataset.k))}fetch('data/checkpoints-round27.json?'+Date.now()).then(r=>r.json()).then(render);setInterval(tick,1000)</script></main></body></html>
