<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Audit Clock</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454;--bad:#ff7272}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.fixture{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:12px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.cp{display:grid;grid-template-columns:90px 1fr;gap:10px;border-top:1px solid var(--l);padding:11px 0}.status{font-weight:900}.captured{color:var(--ok)}.missed{color:var(--bad)}.pending{color:var(--m)}.count{color:var(--a);font-weight:900}.stamp{font-size:12px;color:var(--m)}.result{color:var(--ok);font-weight:900}@media(max-width:600px){.head{display:block}.cp{grid-template-columns:75px 1fr}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Audit Clock</h1><p class="muted">Canonical checkpoint state only. Historical checkpoint files remain preserved but are not used to patch stale truth in the browser.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a href="teams.html">Teams</a><a href="players.html">Players</a><a class="active" href="audit-clock.html">Audit Clock</a><a href="glossary.html">NRL Master Glossary</a><a href="site-master-glossary.html">Site Master Glossary</a><a href="sites.html">Research Sites</a></div><div id="snap" class="stamp"></div><div id="app"></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>x==='AFTER_FULL_TIME'?'after full time':new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Sydney',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true,timeZoneName:'short'}).format(new Date(x));function cls(s){return s.startsWith('CAPTURED')||s==='RESULT_VERIFIED'?'captured':s==='MISSED_NOT_CAPTURED'?'missed':'pending'}function live(f){if(f.lifecycle==='VERIFIED_RESULT')return`<span class="result">FULL TIME · ${esc(f.result)} · ${esc(f.grade||'')}</span>`;const z=new Date(f.kickoff)-Date.now();if(z<=-10800000)return'<span class="count">RESULT VERIFICATION PENDING</span>';if(z<=0)return'<span class="count">MATCH WINDOW</span>';let sec=Math.floor(z/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return`<span class="count">KICKOFF IN ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s</span>`}let D;function render(){snap.textContent=`${D.snapshot} · generated ${fmt(D.generated_at)} · canonical resolved state`;app.innerHTML=D.fixtures.map(f=>`<section class="fixture"><div class="head"><div><b>${esc(f.match)}</b><div class="stamp">Kickoff ${fmt(f.kickoff)}${f.tip?' · MAYHEM '+esc(f.tip)+(f.confidence!=null?' '+esc(f.confidence)+'%':''):''}</div></div><div data-id="${esc(f.fixture_id)}">${live(f)}</div></div>${f.checkpoints.map(c=>`<div class="cp"><b>${esc(c.stage)}</b><div><span class="status ${cls(c.status)}">${esc(c.status.replaceAll('_',' '))}</span><div class="stamp">Due: ${fmt(c.due)}${c.captured_at?' · Captured: '+fmt(c.captured_at):''}</div>${c.record?`<div class="stamp">Evidence record: ${esc(c.record)}</div>`:''}</div></div>`).join('')}</section>`).join('')}fetch('data/checkpoints-round27-canonical.json?'+Date.now()).then(r=>r.json()).then(j=>{D=j;render();setInterval(()=>document.querySelectorAll('[data-id]').forEach(e=>{const f=D.fixtures.find(x=>x.fixture_id===e.dataset.id);if(f)e.innerHTML=live(f)}),1000)}).catch(()=>app.innerHTML='<div class="fixture">Canonical checkpoint data unavailable.</div>')</script></main></body></html>
