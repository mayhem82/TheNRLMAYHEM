<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Teams</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1000px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.card,details{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:10px 0;padding:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.num{font-size:28px;font-weight:900}.picker{width:100%;padding:13px;border-radius:10px;border:1px solid var(--l);background:#0d1116;color:var(--t);font:inherit;font-weight:800}summary{cursor:pointer;font-weight:900;font-size:17px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}.state{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 8px;margin:3px 4px 3px 0;font-size:12px;font-weight:800}.ok{color:var(--ok)}.warn{color:var(--a)}.form{font-weight:900;letter-spacing:2px}.rule{border-left:4px solid var(--g)}.small{font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.split{grid-template-columns:1fr}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Teams</h1><p class="muted">Macro intelligence by club: season performance, recent form, current operational state and accumulated MAYHEM evidence.</p><div class="nav"><a href= rs;Panthers|42–18|Raiders;Broncos|6–30|Knights;Sharks|32–16|Rabbitohs;Wests Tigers|13–16|Eels/23:Titans|8–30|Cowboys;Warriors|28–12|Panthers;Roosters|20–18|Bulldogs;Storm|42–20|Sea Eagles;Dolphins|40–32|Broncos;Rabbitohs|28–24|Eels;Raiders|24–30|Knights;Dragons|24–16|Sharks/24:Panthers|6–12|Roosters;Sea Eagles|0–22|Dolphins;Bulldogs|6–22|Rabbitohs;Sharks|20–24|Raiders;Eels|32–30|Cowboys;Broncos|6–40|Warriors;Knights|36–26|Titans;Wests Tigers|22–24|Dragons/25:Storm|14–22|Panthers;Raiders|30–34|Broncos;Dolphins|34–16|Eels;Knights|24–44|Sea Eagles;Rabbitohs|26–45|Warriors;Dragons|14–44|Bulldogs;Titans|22–30|Sharks;Roosters|24–25|Wests Tigers/26:Broncos|20–46|Storm;Sea Eagles|44–10|Dragons;Panthers|24–10|Bulldogs;Titans|22–42|Rabbitohs;Roosters|12–26|Dolphins;Cowboys|24–10|Wests Tigers;Warriors|46–32|Knights;Eels|38–18|Sharks/27:Bulldogs|20–34|Broncos|Broncos · — · CORRECT;Titans|20–24|Dolphins|Dolphins · 68% · CORRECT;Rabbitohs|50–20|Roosters|Rabbitohs · 82% · CORRECT;Warriors|Pending|Sea Eagles|Warriors · 68% · PENDING;Cowboys|Pending|Raiders|Cowboys · 72% · PENDING;Sharks|Pending|Storm|Storm · 84% · PENDING;Dragons|Pending|Eels|Eels · 62% · PENDING;Panthers|Pending|Wests Tigers|Panthers · 86% · PENDING`;const fixtures=[];D.split('/').forEach(r=>{const [round,s]=r.split(':');s.split(';').forEach(x=>{const [h,sc,a,t]=x.split('|');fixtures.push({round:+round,h,a,sc,t:t||''})})});const teams=[...new Set(fixtures.flatMap(x=>[x.h,x.a]))].sort();const sel=document.getElementById('team'),view=document.getElementById('view');sel.innerHTML=teams.map(t=>`<option>${t}</option>`).join('');function rec(team){const g=fixtures.filter(x=>x.sc!=='Pending'&&(x.h===team||x.a===team));let w=0,l=0,pf=0,pa=0;const hist=g.map(x=>{const [hs,as]=x.sc.split('–').map(Number),home=x.h===team,forp=home?hs:as,ag=home?as:hs,opp=home?x.a:x.h,res=forp>ag?'W':forp<ag?'L':'D';if(res==='W')w++;else if(res==='L')l++;pf+=forp;pa+=ag;return{round:x.round,opp,res,forp,ag}});return{g,w,l,pf,pa,hist}}function render(){const team=sel.value,r=rec(team),last=r.hist.slice(-5),form=last.map(x=>x.res).join(' '),avgF=r.g.length?(r.pf/r.g.length).toFixed(1):'—',avgA=r.g.length?(r.pa/r.g.length).toFixed(1):'—',current=fixtures.find(x=>x.round===27&&(x.h===team||x.a===team)),streak=(()=>{if(!r.hist.length)return'—';const z=r.hist[r.hist.length-1].res;let n=0;for(let i=r.hist.length-1;i>=0&&r.hist[i].res===z;i--)n++;return z+n})();let currentHtml=current?`<div class="row"><div><b>${current.h} v ${current.a}</b><div class="small muted">Round 27 · ${current.sc}</div></div><div class="gold">${current.t||'No recorded MAYHEM tip'}</div></div>`:'<div class="muted">No Round 27 fixture found.</div>';view.innerHTML=`<div class="cards"><div class="card"><div class="num">${r.w}-${r.l}</div><div class="muted">W-L RECORD</div></div><div class="card"><div class="num">${r.pf-r.pa>=0?'+':''}${r.pf-r.pa}</div><div class="muted">POINT DIFFERENTIAL</div></div><div class="card"><div class="num">${avgF}</div><div class="muted">AVG POINTS FOR</div></div><div class="card"><div class="num">${avgA}</div><div class="muted">AVG POINTS AGAINST</div></div></div><details open><summary>Macro Intelligence</summary><div><div class="row"><div>Recent form</div><div class="form gold">${form||'—'}</div></div><div class="row"><div>Current streak</div><div><b>${streak}</b></div></div><div class="row"><div>Last 5 scoring</div><div>${last.reduce((a,x)=>a+x.forp,0)} for · ${last.reduce((a,x)=>a+x.ag,0)} against</div></div><div class="row"><div>Season scoring balance</div><div>${r.pf} for · ${r.pa} against</div></div></div></details><details open><summary>Current Operational Intelligence</summary><div>${currentHtml}<div class="row"><div>Availability / late mail</div><div class="muted">No persisted team-level state yet</div></div><div class="row"><div>Weather effect</div><div class="muted">Shown when captured for an active fixture</div></div><div class="row"><div>Market intelligence</div><div class="muted">No persisted team
