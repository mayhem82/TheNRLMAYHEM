<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Teams</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454;--bad:#ff7d7d}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.card,details{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:10px 0;padding:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.num{font-size:28px;font-weight:900}.picker{width:100%;padding:13px;border-radius:10px;border:1px solid var(--l);background:#0d1116;color:var(--t);font:inherit;font-weight:800}summary{cursor:pointer;font-weight:900;font-size:17px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--l)}.row:first-child{border-top:0}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 8px;margin:3px 4px 3px 0;font-size:11px;font-weight:900}.verified{color:var(--ok)}.signal{color:var(--a)}.contradicted{color:var(--bad)}.form{font-weight:900;letter-spacing:2px}.rule{border-left:4px solid var(--g)}.small{font-size:12px}.playergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.player{background:#0d1116;border:1px solid var(--l);border-radius:10px;padding:12px}.player .name{font-size:18px;font-weight:900}.button{display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:9px;padding:9px 11px;font-weight:900;margin-top:10px}@media(max-width:650px){.row{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Teams</h1><p class="muted">Macro intelligence by club: season trajectory, current operational state and accumulated player-level evidence.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a class="active" href="teams.html">Teams</a><a href="players.html">Players</a><a href="audit-clock.html">Audit Clock</a></div><div class="card"><label for="team"><b>Select team</b></label><select id="team" class="picker"></select></div><div id="view"><div class="card muted">Loading team intelligence…</div></div><script>const sel=document.getElementById('team'),view=document.getElementById('view');let fixtures=[],players=[],playerUpdated=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseSeason(html){const m=html.match(/const D=`([\s\S]*?)`;const K=/);if(!m)throw Error('season ledger unavailable');m[1].split('/').forEach(r=>{const p=r.indexOf(':');const round=+r.slice(0,p),s=r.slice(p+1);s.split(';').forEach(x=>{const [h,sc,a,t]=x.split('|');fixtures.push({round,h,a,sc,t:t||''})})})}function rec(team){const g=fixtures.filter(x=>x.sc!=='Pending'&&(x.h===team||x.a===team));let w=0,l=0,pf=0,pa=0;const hist=g.map(x=>{const [hs,as]=x.sc.split('–').map(Number),home=x.h===team,forp=home?hs:as,ag=home?as:hs,opp=home?x.a:x.h,res=forp>ag?'W':forp<ag?'L':'D';if(res==='W')w++;else if(res==='L')l++;pf+=forp;pa+=ag;return{round:x.round,opp,res,forp,ag}});return{g,w,l,pf,pa,hist}}function render(){const team=sel.value,r=rec(team),last=r.hist.slice(-5),form=last.map(x=>x.res).join(' '),avgF=r.g.length?(r.pf/r.g.length).toFixed(1):'—',avgA=r.g.length?(r.pa/r.g.length).toFixed(1):'—',current=fixtures.find(x=>x.round===27&&(x.h===team||x.a===team)),tp=players.filter(x=>x.team===team).sort((a,b)=>new Date(b.captured_at)-new Date(a.captured_at)),streak=(()=>{if(!r.hist.length)return'—';const z=r.hist.at(-1).res;let n=0;for(let i=r.hist.length-1;i>=0&&r.hist[i].res===z;i--)n++;return z+n})();const currentHtml=current?`<div class="row"><div><b>${esc(current.h)} v ${esc(current.a)}</b><div class="small muted">Round 27 · ${esc(current.sc)}</div></div><div class="gold">${esc(current.t||'No recorded MAYHEM tip')}</div></div>`:'<div class="muted">No Round 27 fixture found.</div>';const phtml=tp.length?`<div class="playergrid">${tp.slice(0,6).map(x=>`<div class="player"><div class="name">${esc(x.player)}</div><div class="small muted">${esc(x.position_context)}</div><div><span class="pill ${String(x.classification).toLowerCase()}">${esc(x.classification)}</span><span class="pill">${esc(x.status)}</span></div><div class="small">${esc(x.observation)}</div><div class="small gold" style="margin-top:7px">${esc(x.decision_effect)}</div></div>`).join('')}</div><a class="button" href="players.html?team=${encodeURIComponent(team)}">All ${esc(team)} player intelligence →</a>`:'<div class="muted">No captured player-level intelligence for this club yet.</div>';const fresh=playerUpdated?new Date(playerUpdated).toLocaleString('en-AU',{timeZone:'Australia/Sydney',dateStyle:'medium',timeStyle:'medium'}):'No player pass';view.innerHTML=`<div class="cards"><div class="card"><div class="num">${r.w}-${r.l}</div><div class="muted">W-L RECORD</div></div><div class="card"><div class="num">${r.pf-r.pa>=0?'+':''}${r.pf-r.pa}</div><div class="muted">POINT DIFFERENTIAL</div></div><div class="card"><div class="num">${avgF}</div><div class="muted">AVG POINTS FOR</div></div><div class="card"><div class="num">${avgA}</div><div class="muted">AVG POINTS AGAINST</div></div></div><details open><summary>Macro Intelligence</summary><div><div class="row"><div>Recent form</div><div class="form gold">${form||'—'}</div></div><div class="row"><div>Current streak</div><div><b>${streak}</b></div></div><div class="row"><div>Last 5 scoring</div><div>${last.reduce((a,x)=>a+x.forp,0)} for · ${last.reduce((a,x)=>a+x.ag,0)} against</div></div><div class="row"><div>Season scoring balance</div><div>${r.pf} for · ${r.pa} against</div></div></div></details><details open><summary>Current Operational Intelligence</summary><div>${currentHtml}<div class="row"><div>Player intelligence state</div><div><b>${tp.length} captured records</b><div class="small muted">Latest pass ${esc(fresh)}</div></div></div><div class="row"><div>Weather / market / conflict state</div><div class="muted">Fixture checkpoint layers remain separately auditable in Intelligence and Audit Clock.</div></div></div></details><details open><summary>Player Intelligence</summary><div>${phtml}</div></details><details><summary>Recent Match History</summary><div>${r.hist.slice().reverse().slice(0,8).map(x=>`<div class="row"><div>R${x.round} v ${esc(x.opp)}</div><div class="${x.res==='W'?'gold':''}"><b>${x.res} ${x.forp}–${x.ag}</b></div></div>`).join('')}</div></details><details><summary>Accumulated MAYHEM Intelligence</summary><div class="card rule"><b>Macro rule:</b> Player → Team → Matchup → Match. Player observations accumulate across fixtures but remain source-attributable and timestamped. Team narratives cannot overwrite contradictory evidence.</div><p class="muted">As audited checkpoints accumulate, this becomes the longitudinal club memory: personnel continuity, recurring availability burden, replacement effects, market response, weather sensitivity, source reliability, calibration and information-advantage history.</p></details>`}Promise.all([fetch('./index.html?'+Date.now()).then(r=>r.text()),fetch('data/player-intelligence-2026.json?'+Date.now()).then(r=>r.json())]).then(([html,p])=>{parseSeason(html);players=p.records||[];playerUpdated=p.updated_at;const teams=[...new Set(fixtures.flatMap(x=>[x.h,x.a]))].sort();sel.innerHTML=teams.map(t=>`<option>${esc(t)}</option>`).join('');const q=new URLSearchParams(location.search).get('team');if(q&&teams.includes(q))sel.value=q;render()}).catch(e=>view.innerHTML='<div class="card muted">Team intelligence data unavailable.</div>');sel.addEventListener('change',render)</script></main></body></html>
