<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The NRL MAYHEM — Teams</title><style>:root{color-scheme:dark;--b:#090b0e;--p:#12161b;--l:#29313a;--t:#f5f7f9;--m:#9da8b4;--g:#f1c84b;--ok:#6fd08c;--a:#ffb454;--bad:#ff7d7d}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px system-ui,Arial}main{max-width:1050px;margin:auto;padding:18px}a{color:var(--t);text-decoration:none}.gold{color:var(--g)}.muted{color:var(--m)}.ok{color:var(--ok)}.bad{color:var(--bad)}h1{font-size:clamp(36px,8vw,68px);margin:.1em 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav a{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 13px;font-weight:800}.nav a.active{border-color:var(--g);color:var(--g)}.card,details{background:var(--p);border:1px solid var(--l);border-radius:12px;margin:10px 0;padding:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.num{font-size:28px;font-weight:900}.picker{width:100%;padding:13px;border-radius:10px;border:1px solid var(--l);background:#0d1116;color:var(--t);font:inherit;font-weight:800}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--l)}.player{background:#0d1116;border:1px solid var(--l);border-radius:10px;padding:12px;margin:8px 0}.pill{display:inline-block;border:1px solid var(--l);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin:4px}.resolution{border-left:4px solid var(--ok);padding-left:10px;margin-top:8px}.contradiction{border-left:4px solid var(--bad)}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><div class="gold"><b>MAYHEM FOOTY TIPPING INTELLIGENCE ENGINE</b></div><h1>Teams</h1><p class="muted">Longitudinal club intelligence derived from the canonical season store and source-attributable player evidence.</p><div class="nav"><a href="./">Season</a><a href="intelligence.html">Intelligence</a><a class="active" href="teams.html">Teams</a><a href="players.html">Players</a><a href="audit-clock.html">Audit Clock</a><a href="glossary.html">NRL Master Glossary</a><a href="site-master-glossary.html">Site Master Glossary</a><a href="sites.html">Research Sites</a></div><div id="snap" class="muted"></div><div class="card"><label><b>Select team</b></label><select id="team" class="picker"></select></div><div id="view"><div class="card muted">Loading canonical team intelligence…</div></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S,I,C,fixtures=[];const sel=document.getElementById('team'),view=document.getElementById('view');function parse(){fixtures=[];for(const r of S.ledger_compact.split('/')){const p=r.indexOf(':');const round=+r.slice(0,p);for(const x of r.slice(p+1).split(';')){const [h,sc,a,t]=x.split('|');fixtures.push({round,h,a,sc,t:t||''})}}}function pair(s){const m=String(s).match(/^(\d+)\s*[-–—]\s*(\d+)$/);return m?[+m[1],+m[2]]:null}function rec(team){const hist=[];let w=0,l=0,d=0,pf=0,pa=0;for(const x of fixtures){if(x.h!==team&&x.a!==team)continue;const p=pair(x.sc);if(!p)continue;const home=x.h===team,f=home?p[0]:p[1],a=home?p[1]:p[0],opp=home?x.a:x.h,r=f>a?'W':f<a?'L':'D';if(r==='W')w++;else if(r==='L')l++;else d++;pf+=f;pa+=a;hist.push({round:x.round,opp,f,a,r})}return{w,l,d,pf,pa,hist,g:hist.length}}function resolutionFor(x){return(C.conflicts||[]).find(c=>c.subject===x.player&&c.fixture===x.fixture)}function render(){const t=sel.value,r=rec(t),last=r.hist.slice(-5),avgF=r.g?(r.pf/r.g).toFixed(1):'—',avgA=r.g?(r.pa/r.g).toFixed(1):'—',records=(I.records||[]).filter(x=>x.team===t).slice().sort((a,b)=>Date.parse(b.captured_at)-Date.parse(a.captured_at));const playerHtml=records.slice(0,10).map(x=>{const rr=resolutionFor(x);return`<div class="player ${x.classification==='CONTRADICTED'?'contradiction':''}"><b>${esc(x.player)}</b> · ${esc(x.position_context)}<div><span class="pill">${esc(x.classification)}</span><span class="pill">${esc(x.status)}</span></div><div>${esc(x.observation)}</div>${rr?`<div class="resolution"><b>CONTRADICTION ${esc(rr.resolution_state)}</b><br>Superseded: ${esc(rr.superseded_state)}<br><b>Resolved state: ${esc(rr.resolved_to)}</b><br>${esc(rr.resolution_event)}<br><span class="muted">Resolved ${esc(rr.resolved_at)} · ${esc(rr.resolved_by)}</span></div>`:''}</div>`}).join('')||'<div class="muted">No captured player intelligence for this club.</div>';view.innerHTML=`<div class="cards"><div class="card"><div class="num">${r.w} wins · ${r.l} losses${r.d?' · '+r.d+' draws':''}</div><div class="muted">SEASON RECORD</div></div><div class="card"><div class="num">${r.pf-r.pa>=0?'+':''}${r.pf-r.pa}</div><div class="muted">POINT DIFFERENTIAL</div></div><div class="card"><div class="num">${avgF}</div><div class="muted">AVERAGE POINTS SCORED</div></div><div class="card"><div class="num">${avgA}</div><div class="muted">AVERAGE POINTS CONCEDED</div></div></div><details open><summary><b>Macro Intelligence</b></summary><div class="row"><div>Recent form</div><b>${last.map(x=>x.r==='W'?'Win':x.r==='L'?'Loss':'Draw').join(' · ')||'—'}</b></div><div class="row"><div>Last five scoring</div><b>${last.reduce((a,x)=>a+x.f,0)} scored · ${last.reduce((a,x)=>a+x.a,0)} conceded</b></div><div class="row"><div>Season scoring balance</div><b>${r.pf} scored · ${r.pa} conceded</b></div></details><details open><summary><b>Player Intelligence and Contradictions</b></summary>${playerHtml}</details><details><summary><b>Recent Match History</b></summary>${r.hist.slice(-8).reverse().map(x=>`<div class="row"><div>Round ${x.round} versus ${esc(x.opp)}</div><b>${x.r==='W'?'Win':x.r==='L'?'Loss':'Draw'} ${x.f}–${x.a}</b></div>`).join('')}</details>`}Promise.all([fetch('data/season-canonical-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/player-intelligence-2026.json?'+Date.now()).then(r=>r.json()),fetch('data/contradiction-resolutions-2026.json?'+Date.now()).then(r=>r.json())]).then(([s,i,c])=>{S=s;I=i;C=c;parse();snap.textContent='CANONICAL SEASON SNAPSHOT: '+S.snapshot;const teams=[...new Set(fixtures.flatMap(x=>[x.h,x.a]))].sort();sel.innerHTML=teams.map(x=>`<option>${esc(x)}</option>`).join('');const q=new URLSearchParams(location.search).get('team');if(q&&teams.includes(q))sel.value=q;render()}).catch(()=>view.innerHTML='<div class="card bad">Team intelligence data unavailable.</div>');sel.onchange=render</script></main></body></html>
